<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Smart Route Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef4ff;font-family:Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:24px}
h1{margin:0;font-size:42px;letter-spacing:-2px;background:linear-gradient(90deg,#63e6ff,#d58cff);-webkit-background-clip:text;color:transparent}.sub{color:#8390a7;font-size:13px;margin:5px 0 20px}
.layout{display:grid;grid-template-columns:1fr 280px;gap:15px}.panel,.card{background:#0e1520;border:1px solid #29364b;border-radius:18px}.panel{padding:15px}.card{padding:14px}.top{display:flex;justify-content:space-between;margin-bottom:12px}.status{color:#8795aa;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;background:#05080d;padding:8px;border-radius:13px}.cell{aspect-ratio:1;background:#111a27;border-radius:3px;transition:.15s}.wall{background:#2b3748}.start{background:#55e6cf;box-shadow:0 0 14px #55e6cf;animation:pulse 1.2s infinite}.goal{background:#df82ff;box-shadow:0 0 14px #df82ff;animation:pulse 1.2s infinite}.explore{background:#35517e;animation:scan .2s}.path{background:#ffc866;box-shadow:0 0 9px #ffc866;animation:path .3s}
@keyframes pulse{50%{transform:scale(.75);opacity:.7}}@keyframes scan{from{transform:scale(.1)}to{transform:scale(1)}}@keyframes path{from{transform:scale(.2);opacity:.1}to{transform:scale(1);opacity:1}}
.algos,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.alg,.btn{border:1px solid #2b384d;background:#151e2c;color:#edf3ff;border-radius:10px;padding:10px;cursor:pointer;font-weight:bold}.alg.active,.primary{background:#203455;border-color:#6387c4}.btn{width:100%;margin-top:8px}.label{font-size:10px;color:#8290a6;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px}.metric{background:#121b28;border:1px solid #263348;border-radius:10px;padding:10px}.metric b{display:block;font-size:19px}.metric span{font-size:10px;color:#8290a6}.formula{font-family:monospace;color:#ffc866}.hint{font-size:11px;color:#7f8ca1;line-height:1.5;margin-top:6px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.app{padding:12px}h1{font-size:32px}}
</style></head><body><div class="app">
<h1>AI Smart Route Finder</h1><div class="sub">Interactive Pathfinding Laboratory • Search Algorithms Visualizer</div>
<div class="layout"><section class="panel"><div class="top"><b>LIVE SEARCH MAP</b><span id="status" class="status">Ready</span></div><div id="grid" class="grid"></div></section>
<aside><div class="card"><div class="label">Algorithm</div><div class="algos"><button class="alg active" data-a="A*">A*</button><button class="alg" data-a="BFS">BFS</button><button class="alg" data-a="DFS">DFS</button><button class="alg" data-a="Greedy">Greedy</button><button class="alg" data-a="Hill">Hill Climb</button></div><button id="run" class="btn primary">▶ RUN SEARCH</button><button id="maze" class="btn">⚡ GENERATE MAZE</button><button id="reset" class="btn">↻ RESET</button></div>
<div class="card" style="margin-top:12px"><div class="label">Live Metrics</div><div class="metrics"><div class="metric"><span>PATH</span><b id="path">—</b></div><div class="metric"><span>EXPLORED</span><b id="nodes">—</b></div><div class="metric"><span>TIME</span><b id="time">—</b></div><div class="metric"><span>SCORE</span><b id="score">—</b></div></div></div>
<div class="card" style="margin-top:12px"><div class="label">A* Intelligence</div><div class="formula">f(n) = g(n) + h(n)</div><div class="hint">g(n) = cost travelled<br>h(n) = Manhattan heuristic<br>AI evaluates promising nodes first.</div></div></aside></div></div>
<script>
const R=15,C=30,N=R*C,G=document.getElementById("grid");let cells=[],walls=new Set(),alg="A*",running=false,start=0,goal=N-1;
const rc=i=>[Math.floor(i/C),i%C],id=(r,c)=>r*C+c,h=(a,b)=>{let[x,y]=rc(a),[u,v]=rc(b);return Math.abs(x-u)+Math.abs(y-v)};
function ns(i){let[r,c]=rc(i),z=[];[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([x,y])=>{if(x>=0&&x<R&&y>=0&&y<C)z.push(id(x,y))});return z}
function paint(){cells.forEach((d,i)=>{d.className="cell";if(walls.has(i))d.classList.add("wall");if(i===start)d.classList.add("start");if(i===goal)d.classList.add("goal")})}
function draw(){G.innerHTML="";cells=[];for(let i=0;i<N;i++){let d=document.createElement("div");d.className="cell";G.appendChild(d);cells.push(d)}paint()}
function maze(){walls=new Set();for(let i=0;i<N;i++)if(Math.random()<.18&&i!==start&&i!==goal)walls.add(i);paint();document.getElementById("status").textContent="Maze generated"}
function search(){let q=[start],seen=new Set([start]),came=new Map(),g=new Map([[start,0]]),order=[];while(q.length){let cur;if(alg==="DFS")cur=q.pop();else{q.sort((a,b)=>{let A=alg==="A*"?(g.get(a)||0)+h(a,goal):h(a,goal),B=alg==="A*"?(g.get(b)||0)+h(b,goal):h(b,goal);return A-B});cur=q.shift()}order.push(cur);if(cur===goal)break;for(let n of ns(cur))if(!walls.has(n)&&!seen.has(n)){seen.add(n);came.set(n,cur);g.set(n,(g.get(cur)||0)+1);q.push(n)}}let path=[];if(seen.has(goal))for(let x=goal;x!==undefined;x=came.get(x)){path.push(x);if(x===start)break}return{order,path:path.reverse()}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){if(running)return;running=true;paint();let t=performance.now(),r=search();document.getElementById("status").textContent=alg+" is scanning…";for(let i=0;i<r.order.length;i++){let x=r.order[i];if(x!==start&&x!==goal)cells[x].classList.add("explore");if(i%3===0)await wait(8)}for(let x of r.path){if(x!==start&&x!==goal){cells[x].classList.remove("explore");cells[x].classList.add("path");await wait(22)}}let ms=performance.now()-t;document.getElementById("path").textContent=r.path.length?r.path.length+" cells":"NO PATH";document.getElementById("nodes").textContent=r.order.length;document.getElementById("time").textContent=ms.toFixed(1)+" ms";document.getElementById("score").textContent=r.path.length?Math.max(0,100-r.path.length):"—";document.getElementById("status").textContent=r.path.length?"✓ Route found":"✕ No route";running=false}
document.querySelectorAll(".alg").forEach(b=>b.onclick=()=>{if(running)return;document.querySelectorAll(".alg").forEach(x=>x.classList.remove("active"));b.classList.add("active");alg=b.dataset.a;document.getElementById("status").textContent=alg+" selected"});
document.getElementById("run").onclick=run;document.getElementById("maze").onclick=()=>{if(!running)maze()};document.getElementById("reset").onclick=()=>{if(!running){walls.clear();paint();["path","nodes","time","score"].forEach(x=>document.getElementById(x).textContent="—");document.getElementById("status").textContent="Ready"}};draw();maze();
</script></body></html>
